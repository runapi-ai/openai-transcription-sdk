[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runapi-openai-transcription"
version = "0.3.0"
description = "RunAPI OpenAI Transcription SDK for speech-to-text integration"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "RunAPI", email = "contact@runapi.ai" }]
keywords = ["runapi", "runapi-ai", "openai", "transcription", "speech-to-text", "audio", "api", "sdk", "typescript", "python", "ruby", "golang", "java", "maven"]
dependencies = ["runapi-core~=0.10.0"]

[project.urls]
Homepage = "https://runapi.ai/models/openai-transcription"
Documentation = "https://runapi.ai/docs/resources/sdks"
Source = "https://github.com/runapi-ai/openai-transcription-sdk"
Issues = "https://github.com/runapi-ai/openai-transcription-sdk/issues"
Changelog = "https://github.com/runapi-ai/openai-transcription-sdk/blob/main/CHANGELOG.md"
"Release Notes" = "https://github.com/runapi-ai/openai-transcription-sdk/releases/tag/python%2Fv0.3.0"

[tool.hatch.build.targets.wheel]
packages = ["src/runapi"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8"]

[tool.runapi]
slug = "openai-transcription"
